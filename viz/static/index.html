<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Neuron Visualizer · Qwen2.5-0.5B</title>
<style>
  :root {
    --bg: #070a12;
    --panel: #0d1220;
    --line: #1b2438;
    --ink: #e6ecf7;
    --dim: #7d8aa3;
    --hot: #ffc266;
    --warm: #ff7a45;
    --cool: #4cc9f0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "JetBrains Mono", Consolas, monospace;
    font-size: 13px; line-height: 1.5;
  }
  header {
    display: flex; align-items: baseline; gap: 16px;
    padding: 18px 22px 14px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 15px; margin: 0; letter-spacing: .02em; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 12px; }
  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%;
         background: var(--cool); margin-right: 6px; vertical-align: middle; }
  .dot.off { background: #3a4356; }
  .bar { display: flex; gap: 10px; padding: 14px 22px; align-items: center; }
  input[type=text] {
    flex: 1; background: var(--panel); border: 1px solid var(--line);
    color: var(--ink); padding: 10px 12px; border-radius: 6px;
    font-family: inherit; font-size: 13px; outline: none;
  }
  input[type=text]:focus { border-color: #2c3c5c; }
  button {
    background: #16203a; color: var(--ink); border: 1px solid #24314e;
    padding: 10px 16px; border-radius: 6px; cursor: pointer;
    font-family: inherit; font-size: 13px;
  }
  button:hover { background: #1c2947; }
  button:disabled { opacity: .45; cursor: default; }
  main { display: grid; grid-template-columns: 1fr 300px; gap: 18px; padding: 4px 22px 22px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; }
  canvas { display: block; width: 100%; height: auto; }
  .cap { color: var(--dim); font-size: 11px; margin-top: 8px; }
  #tok { font-size: 22px; color: var(--hot); min-height: 34px; word-break: break-all; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid #121a2b; }
  .kv span:last-child { color: var(--dim); }
  .nlist { margin-top: 10px; max-height: 260px; overflow: auto; }
  .nrow { display: flex; justify-content: space-between; padding: 2px 0; font-size: 12px; }
  .nrow b { color: var(--cool); font-weight: 500; }
  .nrow i { color: var(--dim); font-style: normal; }
  #out { color: var(--dim); white-space: pre-wrap; word-break: break-word;
         max-height: 90px; overflow: auto; font-size: 12px; }
  .legend { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 11px; margin-top: 8px; }
  .sw { height: 9px; flex: 1; border-radius: 2px;
        background: linear-gradient(90deg, #0d1526, #2b6a8f, var(--cool), var(--hot), var(--warm)); }
</style>
</head>
<body>
<header>
  <h1>Neuron Visualizer</h1>
  <span class="meta"><span class="dot off" id="status"></span><span id="statusText">idle</span></span>
  <span class="meta" id="modelMeta">Qwen2.5-0.5B-Instruct · 24 layers · 4864 neurons/layer</span>
</header>

<div class="bar">
  <input id="prompt" type="text" value="The capital of France is" />
  <button id="go">Generate</button>
  <button id="stop" disabled>Stop</button>
</div>

<main>
  <div class="card">
    <canvas id="heat" width="900" height="520"></canvas>
    <div class="legend">
      <span>quiet</span><span class="sw"></span><span>loud</span>
      <span style="margin-left:12px">rows = layers 0-23, columns = top 64 neurons by |activation|</span>
    </div>
  </div>

  <div class="card">
    <div class="cap">current token</div>
    <div id="tok">-</div>
    <div class="kv"><span>step</span><span id="step">0</span></div>
    <div class="kv"><span>layer</span><span id="layerSel">-</span></div>
    <div class="kv"><span>peak</span><span id="peak">-</span></div>
    <div class="cap" style="margin-top:14px">top neurons, this layer</div>
    <div class="nlist" id="nlist"></div>
  </div>
</main>

<div class="card" style="margin:0 22px 22px">
  <div class="cap">output</div>
  <div id="out"></div>
</div>

<script>
const heat = document.getElementById("heat");
const ctx = heat.getContext("2d");
const ROWS = 24, COLS = 64;
const PAD_L = 34, PAD_T = 8, CW = 13, CH = 20;

let data = null;          // latest payload
let selectedLayer = 0;
let source = null;
let trail = 0;

function colorFor(v) {
  // v in 0..1 -> dark blue to cyan to amber to warm
  const stops = [
    [0.00, 13, 21, 38],
    [0.30, 43, 106, 143],
    [0.55, 76, 201, 240],
    [0.80, 255, 194, 102],
    [1.00, 255, 122, 69],
  ];
  let a = stops[0], b = stops[stops.length - 1];
  for (let i = 0; i < stops.length - 1; i++) {
    if (v >= stops[i][0] && v <= stops[i + 1][0]) { a = stops[i]; b = stops[i + 1]; break; }
  }
  const t = (v - a[0]) / Math.max(1e-6, b[0] - a[0]);
  const r = Math.round(a[1] + (b[1] - a[1]) * t);
  const g = Math.round(a[2] + (b[2] - a[2]) * t);
  const bl = Math.round(a[3] + (b[3] - a[3]) * t);
  return `rgb(${r},${g},${bl})`;
}

function draw() {
  ctx.clearRect(0, 0, heat.width, heat.height);
  ctx.fillStyle = "#0a0f1a";
  ctx.fillRect(0, 0, heat.width, heat.height);

  ctx.font = "10px ui-monospace, monospace";
  for (let r = 0; r < ROWS; r++) {
    ctx.fillStyle = r === selectedLayer ? "#4cc9f0" : "#3d4a63";
    ctx.fillText(String(r).padStart(2, "0"), 6, PAD_T + r * CH + 14);
  }

  if (!data) return;
  for (const layer of data.layers) {
    const r = layer.layer;
    if (r >= ROWS) continue;
    const mx = layer.max || 1e-9;
    for (let c = 0; c < Math.min(COLS, layer.top.length); c++) {
      const v = Math.min(1, Math.abs(layer.top[c].v) / mx);
      ctx.fillStyle = colorFor(v);
      ctx.fillRect(PAD_L + c * CW, PAD_T + r * CH, CW - 1.5, CH - 2.5);
    }
  }
  if (trail > 0) {
    ctx.fillStyle = `rgba(7,10,18,${trail})`;
    ctx.fillRect(0, 0, heat.width, heat.height);
    trail = 0;
  }
}

function updatePanel() {
  if (!data) return;
  document.getElementById("tok").textContent = JSON.stringify(data.token);
  document.getElementById("step").textContent = data.step;
  const layer = data.layers.find(l => l.layer === selectedLayer);
  if (!layer) return;
  document.getElementById("layerSel").textContent = selectedLayer;
  document.getElementById("peak").textContent = layer.max.toFixed(2);
  const list = document.getElementById("nlist");
  list.innerHTML = layer.top.slice(0, 14).map(n =>
    `<div class="nrow"><b>n${n.n}</b><i>${n.v >= 0 ? "+" : ""}${n.v.toFixed(3)}</i></div>`
  ).join("");
}

heat.addEventListener("click", (e) => {
  const rect = heat.getBoundingClientRect();
  const y = (e.clientY - rect.top) * (heat.height / rect.height);
  const r = Math.floor((y - PAD_T) / CH);
  if (r >= 0 && r < ROWS) { selectedLayer = r; updatePanel(); draw(); }
});

function setStatus(text, on) {
  document.getElementById("statusText").textContent = text;
  document.getElementById("status").className = "dot" + (on ? "" : " off");
}

function generate() {
  if (source) source.close();
  const prompt = document.getElementById("prompt").value;
  const max = 40;
  document.getElementById("out").textContent = "";
  document.getElementById("go").disabled = true;
  document.getElementById("stop").disabled = false;
  setStatus("generating", true);

  let text = "";
  source = new EventSource(`/stream?prompt=${encodeURIComponent(prompt)}&max_tokens=${max}`);
  source.onmessage = (ev) => {
    const msg = JSON.parse(ev.data);
    if (msg.done) { finish(); return; }
    data = msg;
    trail = 0.18;
    text += msg.token;
    document.getElementById("out").textContent = text;
    updatePanel();
    draw();
  };
  source.onerror = () => finish();
}

function finish() {
  if (source) { source.close(); source = null; }
  document.getElementById("go").disabled = false;
  document.getElementById("stop").disabled = true;
  setStatus("idle", false);
}

document.getElementById("go").onclick = generate;
document.getElementById("stop").onclick = finish;
document.getElementById("prompt").addEventListener("keydown", (e) => {
  if (e.key === "Enter") generate();
});

fetch("/health").then(r => r.json()).then(j => {
  setStatus(j.loaded ? `ready · ${j.device}` : "loading", j.loaded);
}).catch(() => setStatus("offline", false));

draw();
</script>
</body>
</html>
